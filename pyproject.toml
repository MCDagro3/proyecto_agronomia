[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "scripts"
version = "0.0.1"
description = "Analisis Exploratorio de Datos de Datos Abiertos del DGSIAP."
authors = [
  { name = "MCDrago3" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "bs4>=0.0.2",
    "cchardet>=2.3.0",
    "chardet>=7.6.0",
    "charset-normalizer>=3.5.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pip",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "yarl>=1.25.1",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 80
src = ["scripts"]
include = ["pyproject.toml", "scripts/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
force-sort-within-sections = true

