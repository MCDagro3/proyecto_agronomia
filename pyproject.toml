[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "agro"
version = "0.0.1"
description = "Analisis Exploratorio de Datos de Datos Abiertos del DGSIAP."
authors = [
  { name = "MCDrago3" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "bs4>=0.0.2",
    "pip",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "yarl>=1.25.1",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 80
src = ["agro"]
include = ["pyproject.toml", "agro/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["agro"]
force-sort-within-sections = true

