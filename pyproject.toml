[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "proyecto_agronomia"
version = "0.0.1"
description = "Analisis de factores agricolas, geograficos y climaticos asociados con el exito de la produccion agricola en Mexico entre 2003 y 2025."
authors = [
  { name = "\"Julian Villase\u00f1or, Fausto Medina, David Pe\u00f1a\"" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"
dependencies = [
    "bs4>=0.0.2",
    "cchardet>=2.4.1",
    "dotenv>=0.9.9",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1",
    "joblib>=1.6.0",
    "logger>=1.4",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=11.0.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "rasterio>=1.4.3",
    "scipy>=1.17.0",
    "scikit-learn>=1.9.1",
    "ruff>=0.16.10",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
    "yarl>=1.25.1",
    "pandera>=0.36.0",
]


[tool.ruff]
line-length = 99
src = ["proyecto_agronomia"]
include = ["pyproject.toml", "proyecto_agronomia/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["proyecto_agronomia"]
force-sort-within-sections = true

